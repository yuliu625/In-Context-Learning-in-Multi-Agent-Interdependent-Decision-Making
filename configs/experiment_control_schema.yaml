generator:
  experiment_root_dir: str
  experiment_name: str
  experiment_base_dir: ${generator.experiment_root_dir}/${generator.experiment_name}
  experiment_times: int


experiment:
  network_effect: float
  prices: list[float]
  utility_function_name: Literal['linear',]
  schema_pydantic_base_model_name: Literal['all', 'only-expectation', 'only-choice',]
  chat_history_length: int
  network_size: int
  model_client: Literal['openai', 'google', 'anthropic', 'dashscope', 'deepseek', 'ollama',]
  model_name: str
  is_reasoning: bool
  model_configs: dict
  system_message_prompt_template_name: str
  message_prompt_template_name: str

