name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test-calculations:
    name: Test core calculations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install the project
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest tests/unit/calculations

